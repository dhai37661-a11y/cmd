# Base44 development stack for "Remote CMD".
#
# This project is a native Android app (Kotlin + Jetpack Compose + Room). There is no web
# frontend: the deliverable is an APK that installs on a phone and talks to a companion HTTP
# server on the user's PC over LAN.
#
# One long-running service:
#   preview : Android SDK container on host port 3000. On start it kicks off a Gradle build
#             straight from the bind-mounted checkout (so it always reflects current edits)
#             and immediately serves a status page that reports build/test state, hands out
#             the APK, and shows screenshots rendered from the real Compose UI.
#             Re-run the build with: docker compose -f docker-compose.base44.yml restart preview
name: base44-remote-cmd

services:
  preview:
    image: base44-android-sdk:local
    build:
      context: .
      dockerfile: .base44/android/Dockerfile
    user: "0:0"                      # sandbox checkout is root-owned; gradle must write app/build
    working_dir: /workspace
    environment:
      - GRADLE_USER_HOME=/gradle-home
      - BASE44_PREVIEW_MODE       # bare passthrough: sandbox sets 1, unset elsewhere
      - BASE44_SHOT_DIR=/workspace/build/base44-screenshots
    volumes:
      - .:/workspace
      - gradle-home:/gradle-home
    command: ["sh", "/workspace/.base44/preview/entrypoint.sh"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, sys
          try:
              ok = urllib.request.urlopen("http://127.0.0.1:3000/health", timeout=3).read() == b"ok"
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      base44.project: "Remote CMD"
      base44.kind: web
      base44.port: "3000"

volumes:
  gradle-home:
    name: base44-gradle-home
